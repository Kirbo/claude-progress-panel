# Lint, validate and test the plugin with the toolchain mise.lock pins.
# Tags come from the release job's Releases: they start no pipeline of their own.
workflow:
  # Fail fast: a failed job cancels the rest of the pipeline, and a newer commit cancels an older
  # pipeline's checks (`interruptible`) — never the release job.
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages: [test, release]

# What every OS's job shares: mise's version and the locked toolchain it installs.
.mise-vars:
  variables:
    MISE_VERSION: v2026.11.2
    # sha256 of each OS's mise-$MISE_VERSION asset from the release's SHASUMS256.txt — update all
    # three with the version.
    MISE_SHA256: 62cad463c1413f05398ca339168a8f655120b6f0b0b8adce3bc6758bafaf0602
    MISE_SHA256_MACOS_ARM64: 90684d13d9125cf207c45b19dbdbf19baf8d5d0e3e10109f236b1b4d027416c0
    MISE_SHA256_WINDOWS_X64: 07a552fd755664057bc58cd4fabb8a9fedde77d6b68fcbc81b23714ac0ca034a
    MISE_LOCKED: "1"
    MISE_YES: "1"
    MISE_DATA_DIR: $CI_PROJECT_DIR/.mise-cache
    # Only this repo's mise.toml. The hosted macOS image ships a `~/.tool-versions` (maven, gradle,
    # dotnet, go, java, python, ruby, rust…); the build dir is under $HOME, so mise read it as a
    # parent config and the locked install refused every tool in it. The search stops at the builds
    # dir (and each job's shell also ignores that file by its expanded path — a CI variable cannot
    # expand $HOME); a global/system mise config of the image is not read either.
    MISE_CEILING_PATHS: $CI_BUILDS_DIR
    MISE_GLOBAL_CONFIG_FILE: $CI_PROJECT_DIR/.mise-none.toml
    MISE_SYSTEM_CONFIG_FILE: $CI_PROJECT_DIR/.mise-none.toml
  cache:
    key:
      prefix: $CI_JOB_NAME
      files: [mise.lock]
    paths: [.mise-cache/]

.mise:
  extends: .mise-vars
  # Debian with curl, git and the shared libraries mise's Node needs (libatomic); pinned by digest.
  # (The jdxcode/mise image has no shell; buildpack-deps:bookworm-curl has no libatomic.)
  image: node:26.13.0-bookworm@sha256:a546d3f8acd2af4382668a7e6acd3bc4418e6a27478373e3246f8162f5181509
  before_script:
    - curl -fsSL -o /usr/local/bin/mise "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64"
    - echo "${MISE_SHA256}  /usr/local/bin/mise" | sha256sum -c -
    - chmod +x /usr/local/bin/mise
    - mise trust --yes .
    - mise install

check:
  extends: .mise
  stage: test
  interruptible: true
  script:
    - mise exec -- biome ci .
    - mise exec -- claude --version
    - mise exec -- claude plugin validate .
    - mise exec -- claude plugin test .
    - mise exec -- node --test scripts/
    - mise exec -- node scripts/check-audits.mjs

# The plugin runs wherever Claude Code does: its tests run on macOS and Windows too (GitLab's hosted
# runners). Lint stays on Linux — formatting does not depend on the OS.
check:macos:
  extends: .mise-vars
  stage: test
  interruptible: true
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  before_script:
    - export MISE_IGNORED_CONFIG_PATHS="$HOME/.tool-versions"
    - mkdir -p "$CI_PROJECT_DIR/.mise-bin"
    - curl -fsSL -o "$CI_PROJECT_DIR/.mise-bin/mise" "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-macos-arm64"
    - echo "${MISE_SHA256_MACOS_ARM64}  $CI_PROJECT_DIR/.mise-bin/mise" | shasum -a 256 -c -
    - chmod +x "$CI_PROJECT_DIR/.mise-bin/mise"
    - export PATH="$CI_PROJECT_DIR/.mise-bin:$PATH"
    - mise trust --yes .
    - mise install
  script:
    - mise exec -- claude --version
    - mise exec -- claude plugin validate .
    - mise exec -- claude plugin test .
    - mise exec -- node --test scripts/

check:windows:
  extends: .mise-vars
  stage: test
  interruptible: true
  tags: [saas-windows-medium-amd64]
  before_script:
    - $ErrorActionPreference = 'Stop'
    - $env:MISE_IGNORED_CONFIG_PATHS = "$env:USERPROFILE\.tool-versions"
    - Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/jdx/mise/releases/download/$env:MISE_VERSION/mise-$env:MISE_VERSION-windows-x64.zip" -OutFile mise.zip
    - if ((Get-FileHash mise.zip -Algorithm SHA256).Hash.ToLower() -ne $env:MISE_SHA256_WINDOWS_X64) { throw 'mise checksum mismatch' }
    - Expand-Archive mise.zip -DestinationPath "$env:CI_PROJECT_DIR\.mise-bin"
    - $env:PATH = "$env:CI_PROJECT_DIR\.mise-bin\mise\bin;$env:PATH"
    - mise trust --yes .
    - mise install
  script:
    - mise exec -- claude --version
    - mise exec -- claude plugin validate .
    - mise exec -- claude plugin test .
    - mise exec -- node --test scripts/

# Every plugin version without a Release yet gets one on main — tag `v<version>` at the commit that
# first carried it, notes = git-cliff over the commits since the version before (scripts/release.mjs,
# cliff.toml). The job token creates them; nothing else is needed.
release:
  extends: .mise
  stage: release
  needs: [check, "check:macos", "check:windows"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # Whole history and tags: the script finds every version bump and the tags already made.
    GIT_DEPTH: "0"
  script:
    # git-cliff reads the repo through its embedded git library: mark the checkout safe for it.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - mise exec -- node scripts/release.mjs
