# Lint, validate and test the plugin with the toolchain mise.lock pins.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

check:
  # Debian with curl, git and the shared libraries mise's Node needs (libatomic); pinned by digest.
  # (The jdxcode/mise image has no shell; buildpack-deps:bookworm-curl has no libatomic.)
  image: node:26.13.0-bookworm@sha256:a546d3f8acd2af4382668a7e6acd3bc4418e6a27478373e3246f8162f5181509
  variables:
    MISE_VERSION: v2026.11.2
    # sha256 of mise-$MISE_VERSION-linux-x64 from the release's SHASUMS256.txt — update both together.
    MISE_SHA256: 62cad463c1413f05398ca339168a8f655120b6f0b0b8adce3bc6758bafaf0602
    MISE_LOCKED: "1"
    MISE_YES: "1"
    MISE_DATA_DIR: $CI_PROJECT_DIR/.mise-cache
  cache:
    key:
      files: [mise.lock]
    paths: [.mise-cache/]
  before_script:
    - curl -fsSL -o /usr/local/bin/mise "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64"
    - echo "${MISE_SHA256}  /usr/local/bin/mise" | sha256sum -c -
    - chmod +x /usr/local/bin/mise
    - mise trust --yes .
    - mise install
  script:
    - mise exec -- biome ci .
    - mise exec -- claude --version
    - mise exec -- claude plugin validate .
    - mise exec -- claude plugin test .
    - mise exec -- node --test scripts/
    - mise exec -- node scripts/check-audits.mjs
