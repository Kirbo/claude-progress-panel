# git-cliff: one version's release notes for its GitLab Release (scripts/release.mjs renders the
# range between two version bumps; the Release's name and date carry the version and day, so the
# body is only the grouped changes). Conventional Commits; anything else is left out.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ({{ commit.id | truncate(length=8, end="") }}){% endif %}
{%- endfor %}
{% endfor %}"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The HTML-comment prefixes only order the groups; `striptags` removes them.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(chore|build|ci)", group = "<!-- 6 -->Maintenance" },
  { message = ".*", skip = true },
]
filter_commits = true
sort_commits = "oldest"
